name: Build standalone Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build portable executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name TxtToEpub desktop_app.py

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: TxtToEpub-Windows
          path: dist/TxtToEpub.exe
          if-no-files-found: error
          retention-days: 30
